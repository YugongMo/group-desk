<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Desk</title>
  <script>
    if (new URLSearchParams(location.search).get('app') === 'console') {
      document.documentElement.dataset.app = 'console';
      document.title = 'Console';
    }
  </script>
  <style>
    html[data-app="console"] .gd-brand,
    html:not([data-app="console"]) .console-brand { display: none; }
    :root {
      --tx: var(--grist-theme-text, #262633);
      --bg: var(--grist-theme-widget-bg, #fff);
      --g: var(--grist-theme-control-primary-bg, #16b378);
      --gfg: var(--grist-theme-control-primary-fg, #fff);
    }
    html, body { background: var(--bg); }
    body {
      margin: 0;
      font: 12.5px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Liberation Sans",Helvetica,Arial,sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    #widget { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; }
    #gd-launch-cover {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background: var(--bg);
      color: var(--tx);
      --gd-boot-ink: var(--tx);
      --gd-boot-accent: color-mix(in srgb, var(--g) 82%, var(--gd-boot-ink));
    }
    #gd-launch-cover .gd-boot-panel {
      display: grid;
      justify-items: center;
      gap: 18px;
      width: min(320px, 100%);
      text-align: center;
    }
    #gd-launch-cover .gd-boot-panel[hidden] { display: none; }
    #gd-launch-cover .ttl {
      font: inherit;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -.01em;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    #gd-launch-cover .ttl i {
      display: inline-grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 9px;
      background: var(--g);
      color: var(--gfg);
      font-style: normal;
      font-size: 15px;
    }
    #gd-launch-cover .gd-boot-route { position: relative; width: 100%; height: 18px; --gd-boot-progress: 0%; }
    #gd-launch-cover .gd-boot-dots {
      position: absolute;
      inset-inline: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      gap: 2px;
    }
    #gd-launch-cover .gd-boot-dots span { flex: none; width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
    #gd-launch-cover .gd-boot-trail { opacity: .10; }
    #gd-launch-cover .gd-boot-ahead {
      opacity: .32;
      mask-image: linear-gradient(to right, transparent calc(var(--gd-boot-progress) - 14px), #000 var(--gd-boot-progress));
    }
    #gd-launch-cover .gd-boot-marker {
      position: absolute;
      left: var(--gd-boot-progress);
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--gd-boot-accent);
    }
    #gd-launch-cover .gd-boot-plane { display: block; }
    #gd-launch-cover .gd-boot-plane svg { display: block; width: 22px; height: 18px; fill: currentColor; transform: translateY(-1px); }
    #gd-launch-cover .gd-boot-loading { font-size: 13px; font-weight: 650; letter-spacing: .3em; padding-inline-start: .3em; }
    #gd-launch-cover .gd-boot-loading span {
      display: inline-block;
      margin: 0 -.075em;
      color: var(--gd-boot-ink);
      transform: scale(1);
      will-change: transform;
    }
    #error { text-align: center; }
  </style>
  <script defer src="loader.js"></script>
</head>
<body>
  <div id="gd-launch-cover">
    <div class="gd-boot-panel" role="status" aria-labelledby="launch-title">
      <div id="launch-title"><span class="gd-brand"><span class="ttl"><i>G</i>Group Desk</span></span><span class="console-brand"><span class="ttl"><i>C</i>Console</span></span></div>
      <div class="gd-boot-route" aria-hidden="true">
        <div class="gd-boot-dots gd-boot-trail"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="gd-boot-dots gd-boot-ahead"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <span class="gd-boot-marker"><span class="gd-boot-plane"><svg viewBox="0 0 24 20"><path d="M21.4 8.45H15.1L9.55 2.7H7.1l3.4 5.75H4.85L2.7 6H.9l1.45 4L.9 14h1.8l2.15-2.45h5.65L7.1 17.3h2.45l5.55-5.75h6.3a1.55 1.55 0 0 0 0-3.1Z"/></svg></span></span>
      </div>
      <div class="gd-boot-loading" aria-hidden="true"><span>L</span><span>O</span><span>A</span><span>D</span><span>I</span><span>N</span><span>G</span></div>
    </div>
    <p id="error" role="alert" hidden></p>
    <noscript>Group Desk 需要 JavaScript。Group Desk requires JavaScript.</noscript>
  </div>
</body>
</html>
