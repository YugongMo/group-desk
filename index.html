<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Desk</title>
  <style>
    body {
      margin: 0;
      background: white;
      color: #294766;
      font: 14px system-ui, sans-serif;
    }
    #widget, #startup {
      position: fixed;
      inset: 0;
    }
    #widget { width: 100%; height: 100%; border: 0; }
    #startup {
      display: grid;
      place-items: center;
      background: white;
      text-align: center;
    }
    #startup[hidden], [hidden] { display: none; }
    #flight { width: min(250px, 78vw); }
    #route { position: relative; height: 44px; }
    #route::before {
      content: "";
      position: absolute;
      inset: 50% 0 auto;
      border-top: 2px dashed #abc0d6;
    }
    #plane {
      position: absolute;
      top: 50%;
      left: 0;
      line-height: 1;
      font-size: 25px;
      transform: translateY(-50%) rotate(16deg);
      animation: fly 2.4s ease-in-out infinite;
    }
    #loading { display: flex; justify-content: center; gap: .18em; font-weight: 650; }
    #loading span { animation: wave 1.2s ease-in-out infinite; }
    #loading span:nth-child(2) { animation-delay: .09s; }
    #loading span:nth-child(3) { animation-delay: .18s; }
    #loading span:nth-child(4) { animation-delay: .27s; }
    #loading span:nth-child(5) { animation-delay: .36s; }
    #loading span:nth-child(6) { animation-delay: .45s; }
    #loading span:nth-child(7) { animation-delay: .54s; }
    #error { padding: 0 1rem; }
    @keyframes fly { 0% { left: 0; } 100% { left: calc(100% - 25px); } }
    @keyframes wave { 0%, 60%, 100% { transform: scale(1); } 30% { transform: scale(1.25); } }
    @media (prefers-reduced-motion: reduce) {
      #plane, #loading span { animation: none; }
    }
  </style>
  <script defer src="loader.js"></script>
</head>
<body>
  <div id="startup">
    <div id="flight" role="status" aria-label="Loading Group Desk">
      <div id="route" aria-hidden="true"><span id="plane">✈︎</span></div>
      <div id="loading" aria-hidden="true"><span>L</span><span>O</span><span>A</span><span>D</span><span>I</span><span>N</span><span>G</span></div>
    </div>
    <p id="error" role="alert" hidden></p>
    <noscript>Group Desk 需要 JavaScript。Group Desk requires JavaScript.</noscript>
  </div>
</body>
</html>
